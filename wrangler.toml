# Cloudflare Worker configuration. Keep secrets out of this file.
name = "openpalantir"
main = "workers/index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Configure per environment in Cloudflare; never commit credentials.
# ONTOLOGY_API_URL = "https://ontology-api.example.com"
# CORS_ALLOWED_ORIGINS = "https://your-app.example.com"

[observability]
enabled = true
