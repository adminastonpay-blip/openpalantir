# Wrangler is the source of truth for the Worker deployment.
# Keep credentials in Cloudflare secrets, never in this file.
name = "openpalantir"
main = "./workers/index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

[vars]
# Configure these values for the intended environment in Cloudflare.
# ENABLE_API_V2 = "false"  # opt in only after the upstream /v2 API is ready; default is disabled.
# ONTOLOGY_API_URL = "https://ontology-api.example.com"
# CORS_ALLOWED_ORIGINS = "https://your-app.example.com"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
