name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Validate Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Worker tests
        run: npm test
      - name: Validate OpenPalantir gateway bundle
        run: npx wrangler deploy --dry-run
      - name: Validate ASTON isolated Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.aston.toml

  ontology:
    name: Validate ontology API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ontology/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r ontology/requirements.txt
      - name: Compile Python
        run: python -m compileall -q ontology
      - name: Test ontology API
        working-directory: ontology
        run: python -m pytest -q

  opa:
    name: Validate authorization policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Open Policy Agent
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Test deny-by-default and tenant isolation
        run: opa test configs/opa -v
